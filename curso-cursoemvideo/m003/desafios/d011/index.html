<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 11</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        body {
            height: 100vh;
            width: 100vw;
        }
        div#espaco {
            height: 100%;
            position: relative;
            background: black url(images/espaco.jpg) no-repeat center center fixed;
            background-size: cover;
        }
        div#astronauta {
            width: 500px;
            height: 508px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: transparent url(images/astronauta.png) no-repeat center center fixed;
        }
    </style>
</head>
<body>
    <div id="espaco">
        <div id="astronauta"></div>
    </div>
</body>
</html>
